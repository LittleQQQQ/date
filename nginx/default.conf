# 反向代理（規格書 8.1）：所有請求轉給 api。
# - SSE（POST /api/plans）和 MCP（/mcp）關閉緩衝，進度才會即時送到
# - X-Forwarded-For 一律改成這一層看到的使用者 IP（不沿用用戶端自己帶的），api 的限流以它為準
# - 經過 Cloudflare 通道進來時，使用者 IP 在 CF-Connecting-IP；只相信從 Docker 內部網路（cloudflared 容器）來的
#
# 在 compose 裡這個服務也叫 app、聽 8000：舊版 Cloudflare 通道設定的服務網址 app:8000 不用改。

# api 容器重建後 IP 會變：每 10 秒向 Docker 的 DNS 重新查一次（nginx 1.27.3 起支援 resolve），不用重開 nginx
resolver 127.0.0.11 valid=10s ipv6=off;

upstream api {
    zone api 64k;
    server api:8000 resolve;
    keepalive 16;
}

set_real_ip_from 172.16.0.0/12;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 192.168.0.0/16;
real_ip_header CF-Connecting-IP;

server {
    listen 8000;
    server_name _;

    client_max_body_size 1m;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/plans {
        proxy_pass http://api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;  # 規劃最多 10 分鐘；期間每 15 秒有心跳
    }

    location /mcp {
        proxy_pass http://api;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }

    location / {
        proxy_pass http://api;
    }
}
