# 約會一條龍：網站＋PostgreSQL（LLM 選用）。用法見 README「用 Docker 部署」。
# 密碼與金鑰放在同一層的 .env（例如 DB_PASSWORD=…），compose 會自動讀進來，不會打包進映像。
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: date_planner
      POSTGRES_PASSWORD: ${DB_PASSWORD:?請在 .env 設定 DB_PASSWORD}
      POSTGRES_DB: date_planner
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U date_planner -d date_planner"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  app:
    build: .
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://date_planner:${DB_PASSWORD}@db:5432/date_planner
      ACTIVE_CITIES: ${ACTIVE_CITIES-桃園市}
      # 留空 = 不用 LLM（摘要用範本、Jev 沒把握時直接問使用者）
      # 用這台電腦上裝好的 Ollama：http://host.docker.internal:11434；用下面的 ollama 容器：http://ollama:11434
      OLLAMA_URL: ${OLLAMA_URL:-}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:3b}
      JEV_MODE: ${JEV_MODE:-mock}
      JEV_API_URL: ${JEV_API_URL:-}
      JEV_API_KEY: ${JEV_API_KEY:-}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      AUTO_REFRESH: ${AUTO_REFRESH:-true}
    volumes:
      - cache:/app/data/cache  # 爬蟲的網頁快取，重建容器也保留
    extra_hosts:
      - "host.docker.internal:host-gateway"  # Linux 主機也能用這個名字連到本機的 Ollama
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  # 選用：docker compose --profile llm up -d，第一次要下載模型（見 README）
  ollama:
    image: ollama/ollama
    volumes:
      - ollama:/root/.ollama
    profiles: ["llm"]
    restart: unless-stopped

  # 對外的固定網址（Cloudflare 具名通道）：docker compose --profile tunnel up -d
  # 要先在 Cloudflare 建好通道，把 token 填進 .env 的 CLOUDFLARE_TUNNEL_TOKEN（見 README「換主機」）
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - app
    profiles: ["tunnel"]
    restart: unless-stopped

  # 臨時的公開網址（不用帳號，每次網址都不一樣）：docker compose --profile quick-tunnel up -d
  # 網址在 docker compose logs quick-tunnel 裡，找 trycloudflare.com
  quick-tunnel:
    image: cloudflare/cloudflared:2026.10.1
    command: tunnel --no-autoupdate --url http://app:8000
    depends_on:
      - app
    profiles: ["quick-tunnel"]

volumes:
  pgdata:
  cache:
  ollama:
